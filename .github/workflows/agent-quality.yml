name: Agent Quality

on:
  workflow_dispatch:
    inputs:
      provider:
        description: Provider to evaluate. Use fake for provider-free dry runs.
        required: true
        default: fake
      driver:
        description: Execution driver. fake is provider-free, pi-direct runs a disposable Pi process, livecraft drives the local HTTP API.
        required: true
        default: fake
      runs_on:
        description: JSON string for runs-on. Use "ubuntu-latest" for GitHub-hosted or ["self-hosted","macOS"] for a local OAuth-backed Pi runner.
        required: true
        default: '"ubuntu-latest"'
      model:
        description: Model id requested by the campaign.
        required: true
        default: fake-model
      thinking:
        description: Thinking level requested by the campaign.
        required: true
        default: none
      arms:
        description: Comma-separated arms.
        required: true
        default: livecraft-standard,livecraft-validated
      tasks:
        description: Comma-separated task ids.
        required: true
        default: parser-repair,state-cache,api-persistence
      k:
        description: Trials per cell and pass@k value.
        required: true
        default: '3'
      budget_usd:
        description: Maximum provider spend in USD.
        required: true
        default: '1'
      timeout_minutes:
        description: Campaign timeout in minutes.
        required: true
        default: '30'
      retention_days:
        description: Uploaded artifact retention days.
        required: true
        default: '14'
      campaign_id:
        description: Safe campaign id.
        required: true
        default: manual-quality
      dry_run:
        description: Keep true for provider-free fake driver runs.
        required: true
        type: boolean
        default: true

permissions:
  contents: read

env:
  RESULTS_ROOT: evals/quality/results
  CAMPAIGN_ID: ${{ inputs.campaign_id }}

concurrency:
  group: agent-quality-${{ inputs.provider }}
  cancel-in-progress: false

jobs:
  quality:
    name: Manual quality campaign
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    environment: agent-quality
    timeout-minutes: ${{ fromJSON(inputs.timeout_minutes) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate path-safe campaign id and inputs
        run: |
          set -euo pipefail
          case "$CAMPAIGN_ID" in
            *..*|/*|''|*[!A-Za-z0-9._:-]*)
              echo "Invalid campaign id: $CAMPAIGN_ID" >&2
              exit 2
              ;;
          esac
          case "${{ inputs.k }}" in (*[!0-9]*|'') echo "k must be numeric" >&2; exit 2;; esac
          case "${{ inputs.budget_usd }}" in (*[!0-9.]*|'') echo "budget must be numeric" >&2; exit 2;; esac
          case "${{ inputs.driver }}" in fake|pi-direct|livecraft) ;; *) echo "driver must be fake, pi-direct, or livecraft" >&2; exit 2;; esac
          mkdir -p "$RESULTS_ROOT/$CAMPAIGN_ID"

      - name: Preflight Pi executable for pi-direct
        if: ${{ !inputs.dry_run && inputs.provider != 'fake' && inputs.driver == 'pi-direct' }}
        env:
          PI_QUALITY_EXECUTABLE: ${{ vars.PI_QUALITY_EXECUTABLE }}
        run: |
          set -euo pipefail
          if [ -z "${PI_QUALITY_EXECUTABLE:-}" ]; then
            echo "PI_QUALITY_EXECUTABLE must be set in the agent-quality environment for pi-direct runs." >&2
            exit 2
          fi
          if [ ! -x "$PI_QUALITY_EXECUTABLE" ]; then
            echo "PI_QUALITY_EXECUTABLE is not executable: $PI_QUALITY_EXECUTABLE" >&2
            exit 2
          fi
          "$PI_QUALITY_EXECUTABLE" --version

      - name: Run provider-free fake quality campaign
        if: ${{ inputs.dry_run || inputs.provider == 'fake' }}
        run: |
          set -euo pipefail
          node evals/quality/cli.ts fake --campaign-id "$CAMPAIGN_ID" --results-root "$RESULTS_ROOT"
          node evals/quality/cli.ts compare --k "${{ inputs.k }}" --format markdown "$RESULTS_ROOT/$CAMPAIGN_ID/artifact.json" \
            > "$RESULTS_ROOT/$CAMPAIGN_ID/summary.md"

      - name: Run paid quality campaign when explicitly enabled
        if: ${{ !inputs.dry_run && inputs.provider != 'fake' }}
        env:
          QUALITY_ALLOW_PAID_PROVIDER: ${{ vars.QUALITY_ALLOW_PAID_PROVIDER }}
          PI_QUALITY_EXECUTABLE: ${{ vars.PI_QUALITY_EXECUTABLE }}
          PI_QUALITY_BASE_URL: ${{ vars.PI_QUALITY_BASE_URL }}
        run: |
          set -euo pipefail
          if [ "${QUALITY_ALLOW_PAID_PROVIDER:-}" != "true" ]; then
            echo "Paid provider execution is disabled. Set QUALITY_ALLOW_PAID_PROVIDER=true in the agent-quality environment to enable it." | tee "$RESULTS_ROOT/$CAMPAIGN_ID/summary.md"
            exit 3
          fi
          arms_csv='${{ inputs.arms }}'
          tasks_csv='${{ inputs.tasks }}'
          IFS=',' read -r -a arms <<< "$arms_csv"
          IFS=',' read -r -a tasks <<< "$tasks_csv"
          arm_count=${#arms[@]}
          task_count=${#tasks[@]}
          if [ "$arm_count" -lt 1 ] || [ "$task_count" -lt 1 ]; then
            echo "arms and tasks must both contain at least one item" >&2
            exit 2
          fi
          total_trials=$(( arm_count * task_count * ${{ fromJSON(inputs.k) }} ))
          total_budget_ms=$(( ${{ fromJSON(inputs.timeout_minutes) }} * 60 * 1000 ))
          trial_timeout_ms=$(( total_budget_ms / total_trials ))
          if [ "$trial_timeout_ms" -lt 30000 ]; then
            trial_timeout_ms=30000
          fi
          args=(
            evals/quality/cli.ts run
            --driver '${{ inputs.driver }}'
            --campaign-id "$CAMPAIGN_ID"
            --results-root "$RESULTS_ROOT"
            --provider '${{ inputs.provider }}'
            --model '${{ inputs.model }}'
            --thinking '${{ inputs.thinking }}'
            --arms "$arms_csv"
            --tasks "$tasks_csv"
            --k '${{ inputs.k }}'
            --budget-usd '${{ inputs.budget_usd }}'
            --max-time-ms "$trial_timeout_ms"
          )
          if [ -n "${PI_QUALITY_EXECUTABLE:-}" ]; then
            args+=( --pi-executable "$PI_QUALITY_EXECUTABLE" )
          fi
          if [ '${{ inputs.driver }}' = 'livecraft' ] && [ -n "${PI_QUALITY_BASE_URL:-}" ]; then
            args+=( --base-url "$PI_QUALITY_BASE_URL" )
          fi
          node "${args[@]}"

      - name: Redact artifacts before upload
        if: ${{ always() }}
        run: |
          set -euo pipefail
          if [ -d "$RESULTS_ROOT/$CAMPAIGN_ID" ]; then
            while IFS= read -r -d '' file; do
              perl -0pi -e 's/sk-[A-Za-z0-9_-]{16,}/[REDACTED_API_KEY]/g; s/Authorization: Bearer [A-Za-z0-9._-]+/Authorization: Bearer [REDACTED]/g; s/"access_token":"[^"]+"/"access_token":"[REDACTED]"/g' "$file"
            done < <(find "$RESULTS_ROOT/$CAMPAIGN_ID" -maxdepth 3 -type f -print0)
          fi

      - name: Write job summary
        if: ${{ always() }}
        run: |
          set -euo pipefail
          {
            echo "# Agent Quality Campaign"
            echo
            echo "Provider: ${{ inputs.provider }}"
            echo "Model: ${{ inputs.model }}"
            echo "Thinking: ${{ inputs.thinking }}"
            echo "Arms: ${{ inputs.arms }}"
            echo "Tasks: ${{ inputs.tasks }}"
            echo "k: ${{ inputs.k }}"
            echo "Budget USD: ${{ inputs.budget_usd }}"
            echo "Campaign: $CAMPAIGN_ID"
            echo
            if [ -f "$RESULTS_ROOT/$CAMPAIGN_ID/summary.md" ]; then
              cat "$RESULTS_ROOT/$CAMPAIGN_ID/summary.md"
            else
              echo "No campaign summary was produced. See uploaded logs/artifacts."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload campaign artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: agent-quality-${{ inputs.campaign_id }}
          path: evals/quality/results/${{ inputs.campaign_id }}
          if-no-files-found: warn
          retention-days: ${{ fromJSON(inputs.retention_days) }}
